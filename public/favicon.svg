  </defs>

  <g mask="url(#bs-favicon-cutout)">
    <!-- Lower-right deep burnished bronze half -->
    <rect width="64" height="64" fill="#9A6B26" />
    <!-- Upper-left bright bullion gold diagonal half -->
    <polygon points="0,0 56,0 8,58 0,58" fill="#D4AF37" />
