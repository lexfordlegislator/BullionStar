<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <mask id="bs-favicon-cutout" maskUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#000000" />
