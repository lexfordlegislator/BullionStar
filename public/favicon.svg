      <path
        d="M 10 21 C 10 11, 15.5 6, 25 6 L 35.5 6 C 46.8 6, 52.5 11.4, 52.5 19.2 C 52.5 25.4, 48.6 29.4, 43.4 30.8 C 50.4 32.5, 55 37.3, 55 44.5 C 55 52.8, 48.6 58, 36.8 58 L 10 58 Z"
        fill="#FFFFFF"
      />
